    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link rel="stylesheet" href="calculator.css">
    </head>
    <body>
        <div id="container">
            <div id="card">
                <div id="display-container">
                    <h1>0</h1>
                </div>
                <div id="button-container">
                    <div class="zeroth-row btn-row">
                        <button class="AC-btn">AC</button>
                        <button class="bck-btn">C</button>
                    </div>
                    <div class="first-row btn-row">
                        <button class="num-btn">7</button>
                        <button class="num-btn">8</button>
                        <button class="num-btn">9</button>
                        <button class="operators">/</button>
                    </div>
                    
                    <div class="second-row btn-row">
                        <button class="num-btn">4</button>
                        <button class="num-btn">5</button>
                        <button class="num-btn">6</button>
                        <button class="operators">x</button>
                    </div>

                    <div class="third-row btn-row">
                        <button class="num-btn">1</button>
                        <button class="num-btn">2</button>
                        <button class="num-btn">3</button>
                        <button class="operators">-</button>
                    </div>

                    <div class="fourth-row btn-row">
                        <button class="num-btn">0</button>
                        <button class="dec-btn">.</button>
                        <button class="eql-btn">=</button>
                        <button class="operators">+</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <!-- <script src="calculator.js"></script> -->
    <script type="module" src="calculatorDOM.js"></script>

    </html>
